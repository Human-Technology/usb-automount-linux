# Default configuration for usb-automount.
# Install location: /etc/usb-automount/usb-automount.conf

# Base directory for mount points.
MOUNT_DIR="/media"

# Use a filesystem label for the mount directory when available.
# true: /media/MY_USB_LABEL; false: /media/usb-sdb1
USE_LABEL=true

# Minimum partition size to mount, in bytes (100 MiB by default).
MIN_PARTITION_SIZE=104857600

# Comma-separated device names that must never be mounted, for example: "sda,sdb".
EXCLUDED_DEVICES=""

# Log file location.
LOG_FILE="/var/log/usb-automount.log"

# Desktop notifications: auto, always, or never.
NOTIFY="auto"

# Directory containing executable post-mount and post-unmount hooks.
HOOKS_DIR="/etc/usb-automount/hooks.d"
